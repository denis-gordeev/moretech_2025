version: '3.8'

services:
  # Локальный PostgreSQL для разработки
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: query_analyzer
      POSTGRES_USER: analyzer_user
      POSTGRES_PASSWORD: analyzer_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL:-postgresql://analyzer_user:analyzer_pass@postgres:5432/query_analyzer}
      
      # LLM Configuration (Primary)
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_URL=${LLM_URL}
      
      # Additional LLM Models
      - LLM_API_KEY_1=${LLM_API_KEY_1}
      - LLM_MODEL_1=${LLM_MODEL_1}
      - LLM_URL_1=${LLM_URL_1}
      - LLM_API_KEY_2=${LLM_API_KEY_2}
      - LLM_MODEL_2=${LLM_MODEL_2}
      - LLM_URL_2=${LLM_URL_2}
      
      # Application Configuration
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000, http://193.246.150.25:3000}
      
      # Analysis Configuration
      - MAX_QUERY_LENGTH=${MAX_QUERY_LENGTH:-10000}
      - ANALYSIS_TIMEOUT=${ANALYSIS_TIMEOUT:-30}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:
