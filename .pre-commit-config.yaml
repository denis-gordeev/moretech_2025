# Pre-commit configuration for PostgreSQL Query Analyzer
# Run `pre-commit install` to set up the git hook scripts

repos:
  # Black code formatter
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=120"]
        exclude: ^(frontend/|node_modules/|\.venv/|venv/)

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length=120"]
        exclude: ^(frontend/|node_modules/|\.venv/|venv/)

  # Flake8 linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--config=setup.cfg"]
        exclude: ^(frontend/|node_modules/|\.venv/|venv/)
        additional_dependencies:
          - flake8-bugbear

  # MyPy type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml", "--ignore-missing-imports"]
        exclude: ^(frontend/|node_modules/|\.venv/|venv/|backend/tests/)
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-python-dateutil
          - pydantic
          - pydantic-settings

  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/|node_modules/)
      - id: end-of-file-fixer
        exclude: ^(frontend/|node_modules/)
      - id: check-yaml
        exclude: ^(frontend/|node_modules/)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
        exclude: ^(frontend/|node_modules/)
      - id: check-toml
      - id: debug-statements
        exclude: ^(frontend/|node_modules/)
      - id: check-docstring-first
        exclude: ^(frontend/|node_modules/|backend/tests/)

  # Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-r", "backend/", "-x", "backend/tests/"]
        exclude: ^(frontend/|node_modules/|backend/tests/)
        additional_dependencies:
          - pbr

  # Autoflake - Remove unused imports and variables
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --ignore-init-module-imports
        exclude: ^(frontend/|node_modules/|\.venv/|venv/)

  # Upgrade Python syntax
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: [--py38-plus]
        exclude: ^(frontend/|node_modules/|\.venv/|venv/)

# Configure pre-commit to run on specific file types
exclude: |
  (?x)^(
      frontend/.*|
      node_modules/.*|
      \.venv/.*|
      venv/.*|
      .*\.egg-info/.*|
      build/.*|
      dist/.*
  )$

# Minimum pre-commit version
minimum_pre_commit_version: 3.0.0

# Configure CI settings
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
