[metadata]
name = postgresql-query-analyzer
description = PostgreSQL Query Analyzer with LLM-powered optimization recommendations
author = БОРЖОРА Team
author_email = team@borzhora.dev
license = MIT
license_files = LICENSE
url = https://github.com/borzhora/postgresql-query-analyzer
project_urls =
    Bug Tracker = https://github.com/borzhora/postgresql-query-analyzer/issues
    Documentation = https://github.com/borzhora/postgresql-query-analyzer
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Database
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
python_requires = >=3.8
include_package_data = True

[options.packages.find]
where = backend
exclude =
    tests*

[flake8]
max-line-length = 120
max-complexity = 10
ignore = E203,E501,W503,W504
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    build,
    dist,
    *.egg-info,
    .venv,
    venv,
    frontend,
    node_modules,
    migrations
per-file-ignores =
    __init__.py:F401
    */migrations/*:E501,F401
    */tests/*:S101,D100,D101,D102,D103,D104
    backend/tests/*:S101,D100,D101,D102,D103,D104

[tool:pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = backend/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
asyncio_mode = auto

[coverage:run]
source = backend
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[mypy]
python_version = 3.8
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
files = backend
exclude = frontend/,node_modules/,.venv/,venv/,build/,dist/

[mypy-psycopg2.*]
ignore_missing_imports = true

[mypy-asyncpg.*]
ignore_missing_imports = true

[mypy-openai.*]
ignore_missing_imports = true

[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-alembic.*]
ignore_missing_imports = true

[mypy-pytest.*]
ignore_missing_imports = true

[mypy-fastapi.*]
ignore_missing_imports = true

[mypy-uvicorn.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-backend.tests.*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
